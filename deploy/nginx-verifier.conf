# /etc/nginx/sites-available/verifier
#
# Requires: /etc/nginx/snippets/verifier-proxy.conf (deploy/nginx-proxy-headers.conf)

upstream verifier_app {
    # A unix socket, not a loopback port: only processes allowed by the
    # socket's permissions can reach the application at all.
    server unix:/run/verifier/verifier.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name secure.fin-tech.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 (this host's version) predates the standalone "http2 on;"
    # directive added in 1.25.1; http2 is enabled on the listen line instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name secure.fin-tech.com;

    ssl_certificate     /etc/letsencrypt/live/secure.fin-tech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secure.fin-tech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:VerifierTLS:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Mutual TLS ────────────────────────────────────────────────
    # Requires MTLS_MODE=proxy and PROXY_SHARED_SECRET in /etc/verifier.env;
    # deploy.sh refuses to start the app otherwise.
    #
    # "optional" requests a client certificate from every connecting browser,
    # but only browsers holding a certificate issued by ca.crt are prompted.
    # Modern browsers check the acceptable-CA list nginx sends in the TLS
    # handshake before showing any picker, so a visitor with no certificate
    # from us sees nothing. An enrolled visitor sees the picker once per new
    # TLS connection to this site, not on every page.
    #
    # Disable both lines together with MTLS_MODE=off to fall back to TOTP
    # and the in-browser challenge-response flow only.
    ssl_client_certificate /var/www/verifier/ca/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    # Certificates are large; give the upstream buffers room.
    proxy_buffer_size       128k;
    proxy_buffers         4 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size    1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/verifier.access.log;
    error_log  /var/log/nginx/verifier.error.log;

    location = /healthz {
        include /etc/nginx/snippets/verifier-proxy.conf;
        proxy_pass http://verifier_app;
        access_log off;
    }

    location /static/ {
        alias /var/www/verifier/templates/static/;
        expires 7d;
        access_log off;
    }

    location = /manifest.json {
        alias /var/www/verifier/templates/manifest.json;
        add_header Content-Type application/manifest+json;
    }

    # Credential delivery and the admin panel must never be cached anywhere.
    location /download/ {
        include /etc/nginx/snippets/verifier-proxy.conf;
        proxy_pass http://verifier_app;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location /admin {
        include /etc/nginx/snippets/verifier-proxy.conf;
        proxy_pass http://verifier_app;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location / {
        include /etc/nginx/snippets/verifier-proxy.conf;
        proxy_pass http://verifier_app;
    }
}
