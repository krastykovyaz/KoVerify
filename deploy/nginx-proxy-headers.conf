# /etc/nginx/snippets/verifier-proxy.conf
#
# Included by EVERY location that proxies to the application.
#
# nginx does not merge proxy_set_header across blocks: a location that defines
# any proxy_set_header discards all of them from the enclosing server block.
# Keeping the full set in one snippet is what guarantees the authentication
# headers below are always overwritten.
#
# X-SSL-Client-* carry authentication meaning. They are assigned from nginx's
# own variables unconditionally, so a value supplied by the client is replaced
# before it can reach the application. Removing any line here reopens the
# impersonation hole this configuration exists to close.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
proxy_set_header X-SSL-Client-Cert   $ssl_client_escaped_cert;
proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;
proxy_set_header X-SSL-Client-Serial $ssl_client_serial;

# Proves to the application that a request really came through this nginx.
# Written by deploy.sh from PROXY_SHARED_SECRET, mode 0640.
include /etc/nginx/snippets/verifier-proxy-auth.conf;

proxy_http_version 1.1;
proxy_read_timeout 60s;
