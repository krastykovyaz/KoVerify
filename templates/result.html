<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Результат · {{ code }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 32px 28px;
      max-width: 500px; width: 100%;
      box-shadow: 0 2px 16px rgba(0,0,0,.08);
    }
    .badge {
      display: inline-block; background: #ede9fe; color: #5b21b6;
      font-size: .8rem; font-weight: 600; padding: 4px 12px;
      border-radius: 20px; margin-bottom: 16px; letter-spacing: 2px;
    }
    h1 { font-size: 1.2rem; color: #111; margin-bottom: 4px }
    .sub { color: #aaa; font-size: .8rem; margin-bottom: 24px }

    .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px }
    .side {
      border-radius: 12px; padding: 20px 14px; text-align: center;
      border: 1.5px solid #e5e5e5; transition: all .4s;
    }
    .side.done { border-color: #86efac; background: #f0fdf4 }
    .side-icon { font-size: 2rem; margin-bottom: 8px; display: block }
    .side-name { font-weight: 600; font-size: .95rem; color: #222; min-height: 22px }
    .side-method { font-size: .72rem; color: #aaa; margin: 4px 0 8px; min-height: 16px }
    .badge-ok      { background: #dcfce7; color: #166534; border-radius: 20px;
                     padding: 3px 10px; font-size: .72rem; font-weight: 600 }
    .badge-waiting { background: #f3f4f6; color: #9ca3af; border-radius: 20px;
                     padding: 3px 10px; font-size: .72rem }

    .status-bar {
      padding: 16px; border-radius: 12px; text-align: center;
      font-weight: 600; font-size: .95rem; transition: all .4s;
    }
    .pending  { background: #fffbeb; color: #92400e; border: 1.5px solid #fde68a }
    .verified { background: #dcfce7; color: #166534; border: 1.5px solid #86efac }
    .expired  { background: #fef2f2; color: #991b1b; border: 1.5px solid #fecaca }

    .hint { text-align: center; font-size: .75rem; color: #ccc; margin-top: 12px }
    .btn-new {
      display: block; width: 100%; margin-top: 16px; padding: 11px;
      background: #f5f3ff; color: #4f46e5;
      border: 1.5px solid #c4b5fd; border-radius: 10px;
      font-size: .9rem; font-weight: 600; cursor: pointer;
      text-decoration: none; text-align: center;
    }

    .pulse { animation: pulse 1.6s ease-in-out infinite }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  </style>
</head>
<body>
<div class="card">
  <div class="badge">{{ code }}</div>
  <h1>Статус верификации</h1>
  <p class="sub">Обновляется автоматически каждые 2 секунды</p>

  <div class="sides">
    <div class="side" id="side-a">
      <span class="side-icon pulse" id="icon-a">⏳</span>
      <div class="side-name" id="name-a">ожидание...</div>
      <div class="side-method" id="method-a"></div>
      <span class="badge-waiting" id="badge-a">не прошёл</span>
    </div>
    <div class="side" id="side-b">
      <span class="side-icon pulse" id="icon-b">⏳</span>
      <div class="side-name" id="name-b">ожидание...</div>
      <div class="side-method" id="method-b"></div>
      <span class="badge-waiting" id="badge-b">не прошёл</span>
    </div>
  </div>

  <div class="status-bar pending" id="status-bar">
    ⏳ Ожидаем обе стороны...
  </div>

  <p class="hint" id="hint">обновляется каждые 2 секунды</p>
  <a href="/" class="btn-new" id="btn-new" style="display:none">← Создать новую сессию</a>
</div>

<script>
  const CODE  = "{{ code }}"
  let   done  = false
  let   timer = null

  function setSide(prefix, data) {
    if (!data) return
    const side   = document.getElementById(`side-${prefix}`)
    const icon   = document.getElementById(`icon-${prefix}`)
    const name   = document.getElementById(`name-${prefix}`)
    const method = document.getElementById(`method-${prefix}`)
    const badge  = document.getElementById(`badge-${prefix}`)

    if (data.name)   name.textContent   = data.name
    if (data.method) method.textContent = `через ${data.method}`

    if (data.verified) {
      side.classList.add('done')
      icon.textContent = '✅'
      icon.classList.remove('pulse')
      badge.className   = 'badge-ok'
      badge.textContent = 'верифицирован'
    }
  }

  async function poll() {
    if (done) return
    let data
    try {
      data = await fetch(`/api/session/${CODE}/status`).then(r => r.json())
    } catch { timer = setTimeout(poll, 3000); return }

    setSide('a', data.side_a)
    setSide('b', data.side_b)

    const bar = document.getElementById('status-bar')

    if (data.status === 'both_verified') {
      done = true
      bar.className   = 'status-bar verified'
      bar.textContent = '✅ Оба верифицированы — можете доверять друг другу'
      document.getElementById('hint').textContent = 'Можете закрыть страницу и общаться в любом мессенджере'
      document.getElementById('btn-new').style.display = 'block'
    } else if (data.status === 'expired') {
      done = true
      bar.className   = 'status-bar expired'
      bar.textContent = '❌ Сессия истекла — создайте новую'
      document.getElementById('hint').textContent = ''
      document.getElementById('btn-new').style.display = 'block'
    } else {
      // Показываем кто уже прошёл, кто ещё нет
      const aOk = data.side_a?.verified
      const bOk = data.side_b?.verified
      if (aOk && !bOk) bar.textContent = '✅ Одна сторона прошла — ожидаем вторую...'
      else if (!aOk && bOk) bar.textContent = '✅ Одна сторона прошла — ожидаем вторую...'
      timer = setTimeout(poll, 2000)
    }
  }

  poll()
</script>
</body>
</html>
