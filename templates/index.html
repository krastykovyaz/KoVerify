<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Верификатор</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: system-ui, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 2px 16px rgba(0,0,0,.08);
    }
    h1 { font-size: 1.4rem; color: #111; margin-bottom: 8px }
    .sub { color: #777; font-size: 0.9rem; margin-bottom: 32px; line-height: 1.5 }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: #4338ca }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: #bbb;
      font-size: .85rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e5e5;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 12px;
      transition: border .15s;
    }
    input:focus { outline: none; border-color: #4f46e5 }
    .btn-secondary {
      background: #fff;
      color: #4f46e5;
      border: 1.5px solid #4f46e5;
    }
    .btn-secondary:hover { background: #f5f3ff }
    .result-box {
      display: none;
      margin-top: 24px;
      padding: 20px;
      background: #f0fdf4;
      border-radius: 10px;
      border: 1.5px solid #bbf7d0;
    }
    .result-box p { color: #166534; font-size: .9rem; margin-bottom: 12px }
    .code-big {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 6px;
      color: #111;
      text-align: center;
      margin: 8px 0;
    }
    .copy-link {
      display: block;
      margin-top: 10px;
      padding: 10px;
      background: #dcfce7;
      border-radius: 8px;
      font-size: .8rem;
      color: #166534;
      word-break: break-all;
      cursor: pointer;
      text-align: center;
    }
    .copy-link:hover { background: #bbf7d0 }
    .hint { font-size: .78rem; color: #999; margin-top: 10px; text-align: center }
  </style>
</head>
<body>
<div class="card">
  <h1>🔐 Верификатор</h1>
  <p class="sub">Создайте сессию и отправьте код собеседнику в любом мессенджере.
     Когда оба пройдут верификацию — можете доверять друг другу.</p>

  <button class="btn" onclick="createSession()">Создать новую сессию</button>

  <div id="new-result" class="result-box">
    <p>Отправьте код или ссылку собеседнику:</p>
    <div class="code-big" id="session-code"></div>
    <div class="copy-link" id="session-link" onclick="copyLink()"></div>
    <p class="hint">Нажмите на ссылку чтобы скопировать</p>
    <button class="btn" id="go-btn" style="margin-top:14px">
      Перейти к верификации →
    </button>
  </div>

  <div class="divider">или войти по коду</div>

  <input id="join-code" type="text" placeholder="Введите код сессии (например A3F9B2)"
         maxlength="6" oninput="this.value = this.value.toUpperCase()">
  <button class="btn btn-secondary" onclick="joinSession()">Войти в сессию</button>
</div>

<script>
  const BASE = window.location.origin

  async function createSession() {
    const res  = await fetch('/api/session/create', { method: 'POST' })
    const data = await res.json()
    const url  = `${BASE}/session/${data.code}`

    document.getElementById('session-code').textContent = data.code
    document.getElementById('session-link').textContent = url
    document.getElementById('go-btn').onclick = () => location.href = `/session/${data.code}`
    document.getElementById('new-result').style.display = 'block'
    window._sessionUrl = url
  }

  function copyLink() {
    navigator.clipboard.writeText(window._sessionUrl)
    const el = document.getElementById('session-link')
    el.textContent = '✓ Скопировано!'
    setTimeout(() => el.textContent = window._sessionUrl, 2000)
  }

  function joinSession() {
    const code = document.getElementById('join-code').value.trim()
    if (code.length < 6) { alert('Введите 6-значный код'); return }
    location.href = `/session/${code}`
  }
</script>
</body>
</html>
