<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход в панель управления</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid #2d2d4e;
      border-radius: 16px;
      padding: 40px 36px;
      max-width: 380px;
      width: 100%;
    }
    .icon { font-size: 2.4rem; margin-bottom: 16px; text-align: center }
    h1 { font-size: 1.2rem; color: #e0e0f0; text-align: center; margin-bottom: 6px }
    .sub { color: #666; font-size: .85rem; text-align: center; margin-bottom: 32px }
    label { display: block; font-size: .82rem; color: #888; margin-bottom: 6px }
    input[type=password] {
      width: 100%;
      padding: 12px 14px;
      background: #0f0f1a;
      border: 1.5px solid #2d2d4e;
      border-radius: 10px;
      font-size: 1rem;
      color: #e0e0f0;
      margin-bottom: 20px;
      transition: border .15s;
    }
    input[type=password]:focus { outline: none; border-color: #5b4fe9 }
    .btn {
      width: 100%;
      padding: 13px;
      background: #5b4fe9;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #4c41d4 }
    .error {
      background: #2d1a1a;
      border: 1px solid #5c2020;
      color: #f87171;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: .85rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h1>Панель управления</h1>
  <p class="sub">Только для администратора</p>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <label>Пароль администратора</label>
    <input type="password" name="password" autofocus placeholder="••••••••">
    <button type="submit" class="btn">Войти</button>
  </form>
</div>
</body>
</html>
